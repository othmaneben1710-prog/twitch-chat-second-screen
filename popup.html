<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="actionTitle"></title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Tous les textes viennent de _locales/<langue>/messages.json (attributs data-i18n). -->
  <h1 data-i18n="extName"></h1>
  <p id="etat" class="etat" data-i18n="popupLookingForTab"></p>
  <button id="ouvrir" type="button" disabled data-i18n="popupOpenButton"></button>
  <p class="aide"><span data-i18n="popupShortcut"></span> <bdi dir="ltr"><kbd data-i18n="keyAlt"></kbd> + <kbd data-i18n="keyShift"></kbd> + <kbd>C</kbd></bdi></p>

  <fieldset>
    <legend data-i18n="popupScreenLegend"></legend>
    <div id="ecrans"><p class="aide" data-i18n="popupLoadingScreens"></p></div>
    <p id="memo" class="aide" aria-live="polite"></p>
  </fieldset>

  <p class="aide" data-i18n="popupFullscreenNote"></p>
  <script src="lib/ecrans.js"></script>
  <script src="popup.js"></script>
</body>
</html>
